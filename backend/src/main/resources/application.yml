server:
  port: ${SERVER_PORT:8091}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: admisiones-api
  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27018}/${MONGO_DATABASE:admisiones_usac}?authSource=admin&serverSelectionTimeoutMS=3000&connectTimeoutMS=3000&socketTimeoutMS=5000&maxPoolSize=10
    neo4j:
      database: neo4j
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}
    connection-timeout: 3s
    pool:
      max-connection-pool-size: 10
      connection-acquisition-timeout: 5s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
app:
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
